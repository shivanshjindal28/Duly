name: Keep the demo backend warm

# Render's free plan puts the API to sleep after 15 idle minutes and a cold start takes about a minute, during
# which www.duly.website cannot load data. A light health check every 10 minutes keeps it awake
# (one always-on service fits inside the free plan's monthly hours).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the API health endpoint
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://duly-api-7h0z.onrender.com/api/health; then exit 0; fi
            sleep 10
          done
          echo "Backend did not answer" && exit 1
