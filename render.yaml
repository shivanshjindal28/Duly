# Render Blueprint for the Duly backend (FastAPI). Frontend is on Vercel (frontend/vercel.json).
#
# Free plan (team decision): no persistent disk, so the demo database is built during the
# build step (seed with ~250 invoices of history, then the background demo scenarios S02 S03
# S09a S09b S10 S11 S12, exactly like scripts/demo_prestage.py on a laptop) and every start
# begins from that copy. To get back to the staged state on the live site: Render -> Restart.
# Changes made on the live site are lost when the instance restarts or sleeps; "Reset demo
# data" (admin) rebuilds it at run time. Secrets are generated during the build into
# backend/data/keys (not in git) and ship with that build only.
services:
  - type: web
    name: duly-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r backend/requirements.txt && python scripts/demo_prestage.py --reset
    startCommand: cd backend && OCR_DET_MAX_SIDE=1280 uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    # Redeploy only when something the backend uses changes (it also reads the i18n texts and docs).
    buildFilter:
      paths:
        - backend/**
        - scripts/**
        - demo/**
        - docs/**
        - frontend/src/i18n/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DEMO_MODE
        value: "true"
      - key: AI_MODE
        value: offline
      - key: FRONTEND_ORIGIN
        value: https://www.duly.website
      # 512 MB RAM: cap OCR text detection at runtime (photo upload peak ~530 MB -> ~310 MB for OCR).
      # The build step above runs without it, so the pre-staged scans are read at full accuracy.
      - key: MALLOC_ARENA_MAX
        value: "2"
